<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #000000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
  .intro-container {
    position: fixed;
    inset: 0;
    background: #000000;
    z-index: 9999;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
  }
  .hello-svg {
    width: 300px;
    height: 150px;
    transform: scale(1);
    transition: transform 0.5s ease-out;
  }
  .hello-svg.scale-up {
    transform: scale(1.05);
  }
  .brush-stroke {
    fill: none;
    stroke: #457093;
    stroke-width: 14;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1000;
    stroke-dashoffset: 1000;
  }
  /* Animation sequencing */
  .h1 { animation: draw 0.3s ease-out forwards; }
  .h2 { animation: draw 0.3s ease-out 0.2s forwards; }
  .h3 { animation: draw 0.2s ease-out 0.4s forwards; }
  .e1 { animation: draw 0.4s ease-out 0.6s forwards; }
  .l1 { animation: draw 0.4s ease-out 0.9s forwards; }
  .l2 { animation: draw 0.4s ease-out 1.2s forwards; }
  .o1 { animation: draw 0.5s ease-out 1.5s forwards; }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }
  .intro-container.fade-out {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="intro-container" id="introOverlay">
    <svg viewBox="0 0 350 200" class="hello-svg" id="helloSvg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="rough-brush" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
      <g filter="url(#rough-brush)">
        <!-- H -->
        <path class="brush-stroke h1" d="M 50 40 Q 45 90 40 140" />
        <path class="brush-stroke h2" d="M 100 35 Q 100 90 95 140" />
        <path class="brush-stroke h3" d="M 30 90 Q 75 80 120 85" />
        <!-- e -->
        <path class="brush-stroke e1" d="M 120 120 Q 145 80 160 100 Q 165 125 135 135 Q 155 150 175 125" />
        <!-- l -->
        <path class="brush-stroke l1" d="M 175 125 Q 210 30 190 25 Q 170 20 175 140 Q 185 155 205 135" />
        <!-- l -->
        <path class="brush-stroke l2" d="M 205 135 Q 240 30 220 25 Q 200 20 205 140 Q 215 155 235 135" />
        <!-- o -->
        <path class="brush-stroke o1" d="M 235 135 Q 255 105 275 110 Q 295 115 290 140 Q 280 160 255 150 Q 235 140 255 120 Q 280 110 310 115" />
      </g>
    </svg>
  </div>
  <script>
    setTimeout(() => {
      document.getElementById('helloSvg').classList.add('scale-up');
    }, 2000);
    setTimeout(() => {
      document.getElementById('introOverlay').classList.add('fade-out');
    }, 2800);
  </script>
</body>
</html>
